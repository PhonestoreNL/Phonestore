<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product | Phonestore</title>
  <meta name="description" content="Productinformatie van Phonestore.">
  <link rel="stylesheet" href="style.css?v=20261008-product4">
</head>
<body class="single-product-page">
  <main class="single-product-main">
    <a class="single-product-back" href="index.html#assortiment">← Terug naar assortiment</a>
    <section class="single-product-card">
      <div class="single-product-image-wrap">
        <img id="single-product-image" src="" alt="">
        <img class="product-logo" src="https://raw.githubusercontent.com/PhonestoreNL/Phonestore/main/Phonestore%20logo.png" alt="Phonestore logo">
      </div>
      <div class="single-product-info">
        <p class="eyebrow">PHONESTORE</p>
        <h1 id="single-product-name">Product</h1>
        <p id="single-product-brand" class="single-product-brand"></p>
        <div id="single-product-price" class="single-product-price"></div>
        <a id="single-product-payment" class="single-product-payment" href="#" hidden>Betalen</a>
      </div>
    </section>
  </main>
  <script src="script.js?v=20261008-product8"></script>
  <script>
    (() => {
      const product = new URLSearchParams(window.location.search).get('product') || '';
      if (product === 'iPhone 16') {
        const payment = document.querySelector('#single-product-payment');
        if (payment) {
          payment.href = 'https://nl.penworldwide.org/buybuttons/nl01114/btn/4bb340a5-3f65-4ea2-8761-cf287b7a6e3f/';
          payment.hidden = false;
        }
      }
    })();
  </script>
</body>
</html>
